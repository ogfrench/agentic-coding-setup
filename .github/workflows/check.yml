name: check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate Product Passport references (not runtime proof)
        run: node scripts/check-product-passport.mjs
      - run: node --test
      - name: Package full Agentic Workflow for ChatGPT and verify source integrity
        run: |
          python3 -m unittest discover -s test -p 'test_agentic_workflow_chatgpt.py' -v
          python3 scripts/package_agentic_workflow_chatgpt.py
          unzip -t dist/agentic-workflow-chatgpt-v*.zip
          sha256sum dist/agentic-workflow-chatgpt-v*.zip
      - name: Retain private ChatGPT plugin candidate for host installation
        uses: actions/upload-artifact@v4
        with:
          name: agentic-workflow-chatgpt-candidate
          path: dist/agentic-workflow-chatgpt-v*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Nothing private in the pushed commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/check-public.mjs "$BASE..$HEAD"
          else
            node scripts/check-public.mjs "$HEAD"
          fi
      - run: npx -y @anthropic-ai/claude-code@2.1.323 plugin validate . --strict
      - name: Verify Claude ZIP upload contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path("plugins/agent-workflow")
          with TemporaryDirectory() as temp:
              archive = Path(temp) / "agentic-workflow.zip"
              with ZipFile(archive, "w", compression=ZIP_DEFLATED) as z:
                  for path in sorted(root.rglob("*")):
                      assert not path.is_symlink(), f"Symlink in plugin: {path}"
                      if path.is_file():
                          z.write(path, path.relative_to(root))
              with ZipFile(archive) as z:
                  assert z.testzip() is None
                  assert ".claude-plugin/plugin.json" in z.namelist()
                  plugin = json.loads(z.read(".claude-plugin/plugin.json"))
                  assert plugin["name"] == "agentic-workflow"
                  packed = [n for n in z.namelist() if n.startswith("skills/") and n.endswith("/SKILL.md")]
                  assert len(packed) == 23, f"Claude skill inventory mismatch: {len(packed)}"
                  for name in ("test-strategy", "security-review"):
                      assert f"skills/{name}/SKILL.md" in z.namelist()
                  assert "skills/humanizer/LICENSE" in z.namelist()
                  assert 0 < len(plugin["description"]) <= 500
          PY
      - name: Validate each local plugin
        run: |
          for p in plugins/*/; do
            npx -y @anthropic-ai/claude-code@2.1.323 plugin validate "$p" --strict
          done
      - name: Validate portable Claude workflow plugin
        run: npx -y @anthropic-ai/claude-code@2.1.323 plugin validate portable/ogfrench-workflow --strict
      - name: Clean-config portable Claude plugin install and uninstall
        run: |
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          trap 'rm -rf "$CLAUDE_CONFIG_DIR"' EXIT
          npx -y @anthropic-ai/claude-code@2.1.323 plugin marketplace add ./
          npx -y @anthropic-ai/claude-code@2.1.323 plugin install agentic-workflow@ogfrench --scope user
          npx -y @anthropic-ai/claude-code@2.1.323 plugin list | grep -F 'agentic-workflow@ogfrench'
          npx -y @anthropic-ai/claude-code@2.1.323 plugin uninstall agentic-workflow@ogfrench --scope user
          ! npx -y @anthropic-ai/claude-code@2.1.323 plugin list | grep -F 'agentic-workflow@ogfrench'
      - name: Dry-run the apply step into an empty repo
        run: |
          t="$(mktemp -d)"
          node lib/apply.mjs "$t" nextjs,postgres
          test -f "$t/.claude/settings.json"
          test -s "$t/.claude/knowledge/must.md"
          ls "$t/.claude/skills"
