name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Shared Claude/ChatGPT workflow version (YYYY.MM.N)"
        required: true
        type: string
      accepted_sha:
        description: "Exact reviewed 40-character commit SHA on main"
        required: true
        type: string
      acceptance_url:
        description: "HTTPS URL of actual host acceptance evidence"
        required: false
        default: ""
        type: string
      acceptance_waiver:
        description: "Documented limits if real-host acceptance was not possible"
        required: false
        default: ""
        type: string
      confirmation:
        description: "Type RELEASE_<version>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workflow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      ACCEPTED_SHA: ${{ inputs.accepted_sha }}
      ACCEPTANCE_URL: ${{ inputs.acceptance_url }}
      ACCEPTANCE_WAIVER: ${{ inputs.acceptance_waiver }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require accepted main SHA and explicit release authorization
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "::error::Dispatch from main only"; exit 1; }
          [[ "$VERSION" =~ ^20[0-9]{2}\.(1[0-2]|[1-9])\.[0-9]+$ ]] || { echo "::error::Invalid CalVer"; exit 1; }
          [[ "$ACCEPTED_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$ACCEPTED_SHA" = "$GITHUB_SHA" ] || { echo "::error::Accepted SHA differs from main"; exit 1; }
          [ "$CONFIRMATION" = "RELEASE_$VERSION" ] || { echo "::error::Confirmation does not match release"; exit 1; }
          if [ -n "$ACCEPTANCE_URL" ]; then
            [[ "$ACCEPTANCE_URL" =~ ^https://[^[:space:]]+$ ]] || { echo "::error::Acceptance URL must be HTTPS"; exit 1; }
          else
            [ "${#ACCEPTANCE_WAIVER}" -ge 20 ] || { echo "::error::Supply acceptance evidence or explicit waiver"; exit 1; }
            echo "::warning::Source release without real-host acceptance: $ACCEPTANCE_WAIVER"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate versions, release freshness and notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(".")
          v = os.environ["VERSION"]
          for manifest in ("plugins/agent-workflow/.claude-plugin/plugin.json",
                           "portable/agentic-workflow/plugin.json"):
              assert json.loads((root/manifest).read_text())["version"] == v, manifest
          assert v in (root/"docs/releases/2026-11-13.md").read_text(), "Missing release notes"
          PY
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag v$VERSION already exists; never repoint a release tag"; exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify source, skill routing and private package integrity
        run: |
          node --test
          python3 -m unittest discover -s test -p test_agentic_workflow_chatgpt.py -v
          python3 scripts/package_agentic_workflow_chatgpt.py
      - name: Validate Claude plugin manifests
        run: |
          npx -y @anthropic-ai/claude-code@2.1.270 plugin validate plugins/agent-workflow --strict
      - name: Package public Claude plugins deterministically
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo, ZIP_DEFLATED
          out = Path("dist")
          out.mkdir(exist_ok=True)
          for name in ("agent-workflow",):
              source = Path("plugins") / name
              manifest = json.loads((source/".claude-plugin/plugin.json").read_text())
              version = manifest["version"]
              archive = out / f"{manifest['name']}-claude-v{version}.zip"
              files = sorted(source.rglob("*"))
              with ZipFile(archive, "w", compression=ZIP_DEFLATED, compresslevel=6) as z:
                  for path in files:
                      if path.is_symlink():
                          raise ValueError(f"Symlink in plugin: {path}")
                      if not path.is_file():
                          continue
                      rel = path.relative_to(source).as_posix()
                      info = ZipInfo(rel, date_time=(2026,1,1,0,0,0))
                      info.create_system = 3
                      info.external_attr = 0o644 << 16
                      z.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=6)
                  assert ".claude-plugin/plugin.json" in z.namelist()
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          archive = next(Path("dist").glob("claude-workflow-claude-v*.zip"))
          with ZipFile(archive) as z:
              assert z.testzip() is None, "Damaged Claude ZIP"
              assert ".claude-plugin/plugin.json" in z.namelist(), "Root Claude manifest missing"
              manifest = json.loads(z.read(".claude-plugin/plugin.json"))
              assert 0 < len(manifest["description"]) <= 500, "Claude description exceeds 500 characters"
          PY
          unzip -t dist/claude-workflow-claude-v*.zip
          (cd dist && sha256sum claude-workflow-claude-v*.zip > SHA256SUMS.txt)
      - name: Keep ChatGPT package private for explicitly reviewed installation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentic-workflow-v${{ inputs.version }}-${{ github.sha }}
          path: dist/agentic-workflow-chatgpt-v*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish immutable source release and public Claude packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/claude-workflow-claude-v*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Agentic Workflow $VERSION" \
            --notes-file docs/releases/2026-11-13.md
